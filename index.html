<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches --color-bg, so mobile browser chrome extends the page instead
         of capping it with a default white bar. -->
    <meta name="theme-color" content="#070910" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Belal Alfutayh — Software Engineer specializing in Cloud & API Integration, GCP Certified (ACE)." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Belal Alfutayh — Software Engineer</title>
    <!-- __SITE_URL__ is substituted at build time from profile.siteUrl, so the
         canonical origin is declared in exactly one place. -->
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- og:image must be an absolute URL and a raster: X, LinkedIn, Slack and
         iMessage all skip relative paths and none of them render SVG, so the
         previous /og-image.svg produced no preview card at all. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Belal Alfutayh" />
    <meta property="og:title" content="Belal Alfutayh — Software Engineer" />
    <meta property="og:description" content="Cloud & API Integration · GCP Certified (ACE). Portfolio, experience, and projects." />
    <meta property="og:url" content="__SITE_URL__" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Belal Alfutayh — Cloud & API Integration" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Belal Alfutayh — Software Engineer" />
    <meta name="twitter:description" content="Cloud & API Integration · GCP Certified (ACE). Portfolio, experience, and projects." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <meta name="twitter:image:alt" content="Belal Alfutayh — Cloud & API Integration" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
